# Perfil de exportación: TikTok (Content Posting API)
# Verificado con documentación oficial de TikTok el 2026-11-16 (ver `sources`).
id: tiktok
display_name: TikTok
min_duration_s: 45
max_duration_s: 75
encode:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  video_bitrate: 8M
  max_bitrate: 10M
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  pix_fmt: yuv420p
  container: mp4
subtitles:
  font: Inter
  font_size: 70
  primary_color: "#FFFFFF"
  highlight_color: "#FFD400"
  outline_color: "#000000"
  outline: 5
  margin_v: 480
  margin_h: 140
  uppercase: false
  karaoke: true
safe_area: {top: 260, bottom: 480, left: 140, right: 140}
file:
  containers: [mp4, webm, mov]
  video_codecs: [h264, hevc, vp8, vp9]
  audio_codecs: [aac]
  fps_min: 23
  fps_max: 60
  min_side: 360                   # cada lado entre 360 y 4096 px
  max_side: 4096
  max_size_mb: 4096
  platform_max_duration_s: 180    # la mayoría de creadores: 3 min (el límite real lo da query creator info)
metadata:
  mode: title_caption
  title_max_chars: 2200           # en Direct Post el campo title ES el pie de texto
  description_max_chars: 2200
  caption_max: 2200
  caption_unit: utf16             # 2200 unidades UTF-16
  hashtags_max: 10
  title_required: false
publish:
  privacy_options: [private]   # visibilidades que se pueden autorizar
  unaudited_private_only: true    # clientes sin auditar: todo se publica como privado (SELF_ONLY)
  user_must_choose_privacy: true  # el usuario elige la privacidad manualmente, sin valor por defecto
  daily_post_limit: null
  notes:
    - "Mientras la app no supere la auditoría de TikTok, todo lo publicado queda en modo privado."
    - "Los clientes sin auditar tienen un tope de 5 usuarios por 24 h y solo pueden publicar en cuentas privadas."
    - "Requiere el permiso video.publish aprobado y la autorización del usuario."
    - "El usuario debe ver una vista previa, consentir y elegir la privacidad entre las opciones que devuelve la API."
    - "El límite de duración real depende del creador (consulta de información del creador)."
thumbnail: {supported: false}
verified_at: "2026-11-16"
sources:
  - https://developers.tiktok.com/docs/en/content-posting-api-media-transfer-guide
  - https://developers.tiktok.com/docs/en/content-posting-api-reference-direct-post
  - https://developers.tiktok.com/docs/en/content-posting-api-get-started
unverified:
  - safe_area                 # TikTok no publica márgenes para contenido orgánico
  - subtitles.margin_v
  - encode.video_bitrate
  - metadata.hashtags_max
  - thumbnail                 # la API de Direct Post de vídeo no define miniatura propia en lo consultado
