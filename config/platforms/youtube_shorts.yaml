# Perfil de exportación: YouTube Shorts
# Verificado con documentación oficial el 2026-11-16 (ver `sources`). Lo que no procede de
# documentación oficial está en `unverified`: revísalo antes de confiar en ello.
id: youtube_shorts
display_name: YouTube Shorts
# Rango de exportación = producto (45-75 s) ∩ plataforma (Shorts de hasta 3 min).
min_duration_s: 45
max_duration_s: 75
encode:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  video_bitrate: 8M
  max_bitrate: 10M
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  pix_fmt: yuv420p
  container: mp4
subtitles:
  font: Inter
  font_size: 70
  primary_color: "#FFFFFF"
  highlight_color: "#FFD400"
  outline_color: "#000000"
  outline: 5
  margin_v: 380
  margin_h: 90
  uppercase: false
  karaoke: true
safe_area: {top: 260, bottom: 380, left: 90, right: 90}
file:
  containers: [mp4]
  video_codecs: [h264]
  audio_codecs: [aac]
  platform_max_duration_s: 180   # Shorts de hasta 3 minutos (vídeos subidos desde 2025-12-08)
metadata:
  mode: title_description
  title_max_chars: 100            # API videos: máx. 100 caracteres, sin < ni >
  description_max_chars: 5000
  description_max_bytes: 5000     # la descripción se mide en BYTES UTF-8
  tags_total_chars: 500           # suma de etiquetas; con espacios cuentan 2 caracteres más (comillas)
  hashtags_max: 15
  title_required: true
publish:
  privacy_options: [private, public]   # visibilidades que se pueden autorizar
  notes:
    - "Los Shorts son vídeos cuadrados o verticales de hasta 3 minutos; 9:16 es el formato óptimo."
    - "Publicación por API (YouTube Data API v3, OAuth): los proyectos de API sin verificar (creados tras 2020-07-28) solo pueden subir vídeos PRIVADOS."
thumbnail: {supported: true, width: 1080, height: 1920}
verified_at: "2026-11-16"
sources:
  - https://support.google.com/youtube/answer/15424877
  - https://support.google.com/youtube/answer/12779649
  - https://developers.google.com/youtube/v3/docs/videos
  - https://developers.google.com/youtube/v3/docs/videos/insert
unverified:
  - safe_area                 # YouTube no publica márgenes para contenido orgánico
  - subtitles.margin_v
  - encode.video_bitrate      # recomendación propia, no un requisito oficial
  - metadata.hashtags_max
  - thumbnail
