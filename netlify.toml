# Versión de demostración de la Baticueva en Netlify (solo frontend, sin servidor: datos de ejemplo y producción simulada).
# La fábrica real (Claude, FFmpeg, cola, base de datos) se ejecuta en tu PC con INSTALAR_WINDOWS.bat.
[build]
  base = "frontend"
  command = "npm ci && npm run build:demo"
  publish = "dist-demo"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/personajes/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
