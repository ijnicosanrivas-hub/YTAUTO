[project]
name = "ytauto"
version = "0.1.0"
description = "Fábrica multiagente de vídeos cortos verticales"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "cryptography>=42",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tts = ["piper-tts>=1.2"]
align = ["faster-whisper>=1.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "slow: pruebas que renderizan vídeo real",
  "claude: requieren una sesión real de Claude Code (no se ejecutan por defecto)",
]
addopts = "-m 'not claude'"
